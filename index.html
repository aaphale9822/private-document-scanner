<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PrivateScan</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1d6fe8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="PrivateScan"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f6f6f3;--card:#fff;--tx:#1b1b1a;--mut:#77776f;--ac:#1d6fe8;--ac2:#fff;--bd:#e2e2dc;--dan:#d23b3b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--card:#1d1d1c;--tx:#f0f0ec;--mut:#9a9a92;--ac:#5b9bff;--ac2:#0b0b0b;--bd:#2d2d2b;--dan:#ff6b6b}}
:root[data-theme="dark"]{--bg:#121212;--card:#1d1d1c;--tx:#f0f0ec;--mut:#9a9a92;--ac:#5b9bff;--ac2:#0b0b0b;--bd:#2d2d2b;--dan:#ff6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
#app{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:14px 16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
h1{font-size:24px;margin:0;flex:1}
.sub{color:var(--mut);font-size:13px}
button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;cursor:pointer}
button.p{background:var(--ac);color:var(--ac2);border-color:var(--ac);font-weight:600}
button.d{color:var(--dan)}
button.s{padding:6px 10px;font-size:13px;border-radius:9px}
button.on{border-color:var(--ac);color:var(--ac);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 16px 120px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden}
.card .th{aspect-ratio:3/4;background:#8883 center/cover no-repeat;display:block;width:100%;object-fit:cover}
.card .in{padding:8px 10px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.card .nm{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{text-align:center;color:var(--mut);padding:70px 30px;flex:1}
.empty b{display:block;color:var(--tx);font-size:19px;margin:12px 0 6px}
.fab{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:10px;z-index:6;pointer-events:none}
.fab .btn{pointer-events:auto;box-shadow:0 4px 16px #0003;padding:14px 22px;border-radius:30px}.btn{display:inline-block;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;cursor:pointer;user-select:none;-webkit-user-select:none}.btn.p{background:var(--ac);color:var(--ac2);border-color:var(--ac);font-weight:600}.btn.s{padding:6px 10px;font-size:13px;border-radius:9px}.fi{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
input.t{font:inherit;font-size:20px;font-weight:700;color:var(--tx);background:transparent;border:0;border-bottom:1px dashed var(--bd);flex:1;min-width:0;padding:4px 0;outline:0}
.pg{position:relative}
.pg .n{position:absolute;top:6px;left:6px;background:#000a;color:#fff;border-radius:8px;padding:1px 8px;font-size:12px}
.row{display:flex;gap:6px;padding:6px 8px;justify-content:space-between}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:6px 16px;min-height:0;overflow:hidden}
.wrap{position:relative;display:inline-block;line-height:0;overflow:hidden;border-radius:4px;touch-action:none}
.wrap canvas{display:block;max-width:calc(100vw - 32px);max-height:calc(100dvh - 230px)}
.crop{position:absolute;border:2px solid var(--ac);box-shadow:0 0 0 999px #0007}
.h{position:absolute;width:30px;height:30px;margin:-15px;border-radius:50%;background:var(--ac);border:3px solid #fff;touch-action:none}
.bar{display:flex;gap:8px;padding:10px 16px;flex-wrap:wrap;justify-content:center;align-items:center}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;z-index:9;max-width:90%}
.lock{font-size:12px;color:var(--mut);text-align:center;padding:0 16px 10px}
</style></head><body>
<div id="app"></div>
<input type="file" id="cam" class="fi" accept="image/*" capture="environment">
<input type="file" id="imp" class="fi" accept="image/*" multiple>
<script>
const $=s=>document.querySelector(s),app=$('#app');
let docs=[],cur=null,ed=null,queue=[],conf=null,urls=[],memOnly=false;
const mem={};
/* ---------- local storage (IndexedDB, nothing leaves the device) ---------- */
const db=new Promise(r=>{try{const q=indexedDB.open('privatescan',1);q.onupgradeneeded=()=>q.result.createObjectStore('docs',{keyPath:'id'});q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
async function tx(mode,f){const d=await db;if(!d){memOnly=true;return null}return new Promise(res=>{try{const t=d.transaction('docs',mode),q=f(t.objectStore('docs'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>res(null)}catch(e){res(null)}})}
async function load(){const r=await tx('readonly',s=>s.getAll());docs=(r||Object.values(mem)).sort((a,b)=>b.created-a.created)}
const put=d=>{mem[d.id]=d;return tx('readwrite',s=>s.put(d))};
const del=id=>{delete mem[id];return tx('readwrite',s=>s.delete(id))};
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
const url=b=>{const u=URL.createObjectURL(b);urls.push(u);return u};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ---------- views ---------- */
function render(){urls.forEach(URL.revokeObjectURL);urls=[];
 if(ed)return renderEdit();
 const d=docs.find(x=>x.id===cur);
 if(d)return renderDoc(d);
 renderLib()}
function renderLib(){
 app.innerHTML=`<header><h1>PrivateScan</h1></header><div class="lock">🔒 Everything stays on this device. No account, no uploads.${memOnly?' <b>Storage unavailable: scans last only until you close this page.</b>':''}</div>`+
 (docs.length?`<div class="grid">${docs.map(d=>`<div class="card" data-o="${d.id}"><img class="th" src="${url(d.pages[0].blob)}" alt=""><div class="in"><div style="min-width:0"><div class="nm">${esc(d.name)}</div><div class="sub">${d.pages.length} page${d.pages.length>1?'s':''} · ${new Date(d.created).toLocaleDateString()}</div></div></div></div>`).join('')}</div>`:
 `<div class="empty">📄<b>No scans yet</b>Tap Scan to photograph a document, or import images from your gallery.</div>`)+
 `<div class="fab"><label class="btn p" id="scan" for="cam">📷 Scan</label><label class="btn" id="imb" for="imp">Import</label></div>`;
 $('#scan').onclick=()=>{cur=null};$('#imb').onclick=()=>{cur=null};
 app.querySelectorAll('[data-o]').forEach(e=>e.onclick=()=>{cur=e.dataset.o;render()})}
function renderDoc(d){
 app.innerHTML=`<header><button class="s" id="bk">‹ Back</button><input class="t" id="nm" value="${esc(d.name)}" aria-label="Document name"></header>
 <div class="bar" style="justify-content:flex-start;padding-top:0"><button class="p s" id="pdf">Export PDF</button><label class="btn s" for="cam">＋ Camera</label><label class="btn s" for="imp">＋ Import</label><button class="s d" id="dd">${conf==='doc'?'Tap again to delete':'Delete'}</button></div>
 <div class="grid">${d.pages.map((p,i)=>`<div class="card"><div class="pg"><img class="th" src="${url(p.blob)}" alt="Page ${i+1}"><span class="n">${i+1}</span></div><div class="row"><button class="s" data-m="${i}" ${i?'':'disabled'}>◀</button><button class="s d" data-x="${i}">${conf==='p'+i?'Sure?':'✕'}</button><button class="s" data-n="${i}" ${i<d.pages.length-1?'':'disabled'}>▶</button></div></div>`).join('')}</div>`;
 $('#bk').onclick=()=>{cur=null;conf=null;render()};
 $('#nm').onchange=async e=>{d.name=e.target.value.trim()||d.name;await put(d)};

 $('#pdf').onclick=()=>exportPDF(d);
 $('#dd').onclick=async()=>{if(conf!=='doc'){conf='doc';return render()}conf=null;await del(d.id);cur=null;await load();render()};
 app.querySelectorAll('[data-x]').forEach(b=>b.onclick=async()=>{const i=+b.dataset.x;if(conf!=='p'+i){conf='p'+i;return render()}conf=null;d.pages.splice(i,1);if(!d.pages.length){await del(d.id);cur=null;await load()}else await put(d);render()});
 const mv=(i,j)=>async()=>{[d.pages[i],d.pages[j]]=[d.pages[j],d.pages[i]];await put(d);render()};
 app.querySelectorAll('[data-m]').forEach(b=>b.onclick=mv(+b.dataset.m,+b.dataset.m-1));
 app.querySelectorAll('[data-n]').forEach(b=>b.onclick=mv(+b.dataset.n,+b.dataset.n+1))}
/* ---------- capture + edit ---------- */
async function startEdit(file){
 try{let bm;try{bm=await createImageBitmap(file,{imageOrientation:'from-image'})}catch(_){try{bm=await createImageBitmap(file)}catch(__){bm=await new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=url(file)})}}
  const k=Math.min(1,2200/Math.max(bm.width,bm.height)),c=document.createElement('canvas');
  c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
  ed={src:c,mode:'photo',enh:true,c:{x0:.04,y0:.04,x1:.96,y1:.96}};render()}
 catch(e){toast('Could not open that image');next()}}
function next(){if(queue.length)startEdit(queue.shift());else render()}
$('#cam').onchange=e=>{queue=[...e.target.files];e.target.value='';next()};
$('#imp').onchange=e=>{queue=[...e.target.files];e.target.value='';next()};
const FILT={photo:'none',gray:'grayscale(1)'};
const css=()=>(ed.mode==='gray'?'grayscale(1) ':'')+(ed.enh?'contrast(1.35) brightness(1.03)':'')||'none';
function renderEdit(){
 app.innerHTML=`<header><button class="s" id="ca">✕ Cancel</button><h1 style="font-size:18px;text-align:center">Adjust scan</h1><button class="p s" id="sv">Save ✓</button></header>
 <div class="stage"><div class="wrap" id="w"></div></div>
 <div class="bar"><button class="s" id="rot">⟳ Rotate</button><button class="s ${ed.mode==='photo'?'on':''}" data-md="photo">Photo</button><button class="s ${ed.mode==='gray'?'on':''}" data-md="gray">Grayscale</button><button class="s ${ed.enh?'on':''}" id="en">✨ Enhance</button></div>
 <div class="lock">Drag the corners to crop to your document.</div>`;
 const w=$('#w');ed.src.style.filter=css();w.appendChild(ed.src);
 const box=document.createElement('div');box.className='crop';w.appendChild(box);
 const hs={};['tl','tr','bl','br'].forEach(k=>{const h=document.createElement('div');h.className='h';box.appendChild(h);hs[k]=h;
  h.style.left=k[1]==='l'?'0':'100%';h.style.top=k[0]==='t'?'0':'100%';
  h.onpointerdown=e=>{e.preventDefault();h.setPointerCapture(e.pointerId);
   h.onpointermove=m=>{const r=w.getBoundingClientRect(),fx=Math.min(1,Math.max(0,(m.clientX-r.left)/r.width)),fy=Math.min(1,Math.max(0,(m.clientY-r.top)/r.height)),c=ed.c,g=.08;
    if(k[1]==='l')c.x0=Math.min(fx,c.x1-g);else c.x1=Math.max(fx,c.x0+g);
    if(k[0]==='t')c.y0=Math.min(fy,c.y1-g);else c.y1=Math.max(fy,c.y0+g);draw()};
   h.onpointerup=()=>{h.onpointermove=null}}});
 const draw=()=>{const c=ed.c;box.style.left=c.x0*100+'%';box.style.top=c.y0*100+'%';box.style.width=(c.x1-c.x0)*100+'%';box.style.height=(c.y1-c.y0)*100+'%'};draw();
 $('#ca').onclick=()=>{ed=null;queue=[];render()};
 $('#rot').onclick=()=>{const s=ed.src,o=document.createElement('canvas');o.width=s.height;o.height=s.width;const x=o.getContext('2d');x.translate(o.width,0);x.rotate(Math.PI/2);x.drawImage(s,0,0);
  const c=ed.c;ed.c={x0:1-c.y1,y0:c.x0,x1:1-c.y0,y1:c.x1};ed.src=o;renderEdit()};
 app.querySelectorAll('[data-md]').forEach(b=>b.onclick=()=>{ed.mode=b.dataset.md;renderEdit()});
 $('#en').onclick=()=>{ed.enh=!ed.enh;renderEdit()};
 $('#sv').onclick=save}
async function save(){
 const {src,c,mode,enh}=ed,sw=(c.x1-c.x0)*src.width,sh=(c.y1-c.y0)*src.height,o=document.createElement('canvas');
 o.width=Math.round(sw);o.height=Math.round(sh);const x=o.getContext('2d');
 x.drawImage(src,c.x0*src.width,c.y0*src.height,sw,sh,0,0,o.width,o.height);
 if(mode==='gray'||enh){const im=x.getImageData(0,0,o.width,o.height),d=im.data,k=enh?1.35:1,b=enh?8:0,cl=v=>v<0?0:v>255?255:v;
  for(let i=0;i<d.length;i+=4){let r=d[i],g=d[i+1],bl=d[i+2];if(mode==='gray')r=g=bl=.299*r+.587*g+.114*bl;
   d[i]=cl((r-128)*k+128+b);d[i+1]=cl((g-128)*k+128+b);d[i+2]=cl((bl-128)*k+128+b)}x.putImageData(im,0,0)}
 const blob=await new Promise(r=>o.toBlob(r,'image/jpeg',.88)),pg={blob,w:o.width,h:o.height};
 let d=docs.find(z=>z.id===cur);
 if(!d){d={id:'d'+Date.now(),name:'Scan '+new Date().toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}),created:Date.now(),pages:[]};cur=d.id;docs.unshift(d)}
 d.pages.push(pg);await put(d);ed=null;await load();
 if(queue.length)next();else{render();toast('Page saved')}}
/* ---------- PDF export (built on-device) ---------- */
async function exportPDF(d){
 try{const enc=new TextEncoder(),parts=[],offs=[];let pos=0;
  const push=v=>{const b=typeof v==='string'?enc.encode(v):v;parts.push(b);pos+=b.length};
  const obj=(id,head,st)=>{offs[id]=pos;push(`${id} 0 obj\n${head}\n`);if(st){push('stream\n');push(st);push('\nendstream\n')}push('endobj\n')};
  const n=d.pages.length;push('%PDF-1.4\n');
  obj(1,'<</Type/Catalog/Pages 2 0 R>>');
  obj(2,`<</Type/Pages/Count ${n}/Kids[${d.pages.map((_,i)=>`${3+3*i} 0 R`).join(' ')}]>>`);
  for(let i=0;i<n;i++){const p=d.pages[i],W=595,H=Math.round(595*p.h/p.w*100)/100,jpg=new Uint8Array(await p.blob.arrayBuffer());
   obj(3+3*i,`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${W} ${H}]/Resources<</XObject<</Im0 ${5+3*i} 0 R>>>>/Contents ${4+3*i} 0 R>>`);
   const ct=`q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`;obj(4+3*i,`<</Length ${ct.length}>>`,enc.encode(ct));
   obj(5+3*i,`<</Type/XObject/Subtype/Image/Width ${p.w}/Height ${p.h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${jpg.length}>>`,jpg)}
  const xr=pos,tot=3*n+3;push(`xref\n0 ${tot}\n0000000000 65535 f \n`);
  for(let i=1;i<tot;i++)push(String(offs[i]).padStart(10,'0')+' 00000 n \n');
  push(`trailer\n<</Size ${tot}/Root 1 0 R>>\nstartxref\n${xr}\n%%EOF`);
  const blob=new Blob(parts,{type:'application/pdf'}),f=new File([blob],d.name.replace(/[^\w\- ]+/g,'')+'.pdf',{type:'application/pdf'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:d.name});return}catch(e){if(e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=f.name;a.target='_blank';document.body.appendChild(a);a.click();a.remove();
  toast('If nothing downloaded, use a share-capable browser on your phone')}
 catch(e){toast('Export failed')}}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
load().then(render);
</script></body></html>
